# window_rule=width:1500,height:900,app_id:blueman-manager

# -- WPS Office: no animation, shadow, radius or border; fake maximize --
# window_rule=animation_type_open:none,animation_type_close:none,no_shadow:1,no_radius:1,no_border:1,app_id:^wps$,title:^wps$
# window_rule=force_fake_maximize:1,app_id:^wpsoffice$

