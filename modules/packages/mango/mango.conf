# ==========================================================================
# MONITOR
# ==========================================================================
# Output name, resolution, refresh rate, position and scale.
monitor_rule=name:^HDMI-A-2$,width:1920,height:1080,refresh:179.99,x:0,y:0,scale:1

# ==========================================================================
# STARTUP AND ENVIRONMENT
# ==========================================================================
# Make directly launched GTK apps use the generated theme.
# env=GTK_THEME,ThemeManager

# Run once when the compositor starts.
exec_once = amane run
exec_once = kdeconnect-indicator
exec_once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec_once = systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr

# ==========================================================================
# EFFECTS
# ==========================================================================
# Blur behind translucent windows and layer surfaces (bars, docks).
blur=1
blur_layer=0
# Cache the wallpaper blur (saves GPU).
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# Shadows are disabled.
shadows=0
layer_shadows=0

# Rounded corners, window opacity and dimming of unfocused windows.
border_radius=5
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=1

# ==========================================================================
# ANIMATIONS
# ==========================================================================
# Window and layer-surface animations.
animations=1
layer_animations=0
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
# Tag switch direction: 0 vertical, 1 horizontal.
tag_animation_direction=0
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
# Durations in milliseconds.
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=400
# Cubic bezier curves.
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.58,0.98,0.58,0.98
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# ==========================================================================
# LAYOUTS
# ==========================================================================
# Layouts cycled by switch_layout (SUPER+Tab). The first is the default.
circle_layout=dwindle,scroller,fair

# Start every tag on the dwindle layout.
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
tag_rule=id:10,layout_name:dwindle

# Dwindle: binary tree of splits, each new window splits the focused one.
# New windows open to the right (side-by-side) or below (top/bottom).
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
# Keep the sibling's split orientation when a window closes.
dwindle_preserve_split=1

# Scroller: horizontal strip of windows.
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
# Widths cycled by switch_proportion_preset.
scroller_proportion_preset=0.5,0.8,1.0

# ==========================================================================
# OVERVIEW
# ==========================================================================
# Hot corner opens the overview (default: bottom-left).
enable_hotarea=1
hotarea_size=10
overview_gap_inner=5
overview_gap_outer=30

# ==========================================================================
# MISC
# ==========================================================================
# Number of tags (workspaces).
tag_num=10
# Do not keep XWayland running when no X11 apps are open.
xwayland_persistence=0
sync_obj_enable=1
no_border_when_single=0
# Time window (ms) for consecutive scroll events in axisbind.
axis_bind_apply_timeout=100
# Do not steal focus when a window asks for activation.
focus_on_activate=0
# Focus follows the cursor, and the cursor follows keyboard focus.
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
# Floating windows snap to edges within this distance (px).
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=oreo_black_cursors
cursor_hide_timeout=0
# Dragging a tiled window onto another swaps them.
drag_tile_to_tile=1
# Only one scratchpad visible at a time.
single_scratchpad=1

# ==========================================================================
# INPUT
# ==========================================================================
repeat_rate=75
repeat_delay=300
numlock_on=1
xkb_rules_layout=us

# Mouse: flat acceleration profile, slightly reduced speed.
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=-0.55

# Scroll method: 1 two-finger, 2 edge, 4 button.
mouse_scroll_method=4
axis_scroll_factor=1.0

# Trackpad is disabled.
disable_trackpad=1

# ==========================================================================
# APPEARANCE
# ==========================================================================
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=20
gap_outer_vertical=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0

# Colours (0xRRGGBBAA): background, borders and per-state border colours.
root_color=0x201b14ff
border_color=0x444444ff
focus_color=0x8BAA9Bff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0xBABD2Cff
urgent_color=0xad401fff
scratchpad_color=0xc4939dff
global_color=0x8d64cfff
overlay_color=0x95C381ff

# Colours generated by theme-manager override the ones above.
# If the file is missing, the values above are kept.
source_optional=~/.config/mango/theme.conf

# ==========================================================================
# KEY BINDINGS
# bind=<MODIFIERS>,<KEY>,<COMMAND>,<PARAMETERS>
# ==========================================================================

# -- Compositor and session --
bind=SUPER,r,reload_config
# Session menu (amane).
bind=SUPER,x,spawn,amane ipc call auxiliary session
bind=SUPER+CTRL,x,quit
bind=SUPER+SHIFT,x,spawn,poweroff
bind=SUPER+SHIFT,r,spawn,reboot

# -- Launch and close --
# Terminal from $TERMINAL, falling back to kitty.
bind=SUPER,Return,spawn_shell,${TERMINAL:-kitty}
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,killclient,force
bind=SUPER+SHIFT,b,spawn,firefox
bind=SUPER,e,spawn_shell,unset DISPLAY && emacsclient -c
bind=SUPER+SHIFT,e,spawn_shell,~/Scripts/emacsRestart.sh
bind=SUPER,backslash,spawn,amane ipc call media play-pause

# -- Amane shell --
bind=SUPER,a,spawn,amane ipc call island
bind=ALT,space,spawn,amane ipc call auxiliary search
bind=none,Print,spawn,amane ipc call auxiliary screenshot
bind=SHIFT,Print,spawn,amane ipc call auxiliary record

# -- Focus --
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
# Jump back to the last focused window.
bind=SUPER,grave,focuslast
# Cycle focus through the overview.
bind=SUPER+SHIFT,n,overcircle,next
bind=SUPER+SHIFT,p,overcircle,previous

# -- Move (swap) tiled windows --
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# -- Resize windows by 20px --
bindc=SUPER+CTRL,h,resizewin,-20,+0
bindc=SUPER+CTRL,l,resizewin,+20,+0
bindc=SUPER+CTRL,k,resizewin,+0,-20
bindc=SUPER+CTRL,j,resizewin,+0,+20

# -- Move floating windows by 50px --
bindc=SUPER+CTRL+SHIFT,h,movewin,-50,+0
bindc=SUPER+CTRL+SHIFT,l,movewin,+50,+0
bindc=SUPER+CTRL+SHIFT,k,movewin,+0,-50
bindc=SUPER+CTRL+SHIFT,j,movewin,+0,+50

# -- Window state --
bind=SUPER,s,togglefloating
bind=SUPER,f,togglefullscreen
# Maximize but keep bars visible.
bind=SUPER+SHIFT,f,togglemaximizescreen
bind=SUPER+CTRL,space,togglefakefullscreen
# Show the window on all tags.
bind=SUPER+SHIFT,u,toggleglobal
bind=SUPER+SHIFT,o,toggleoverlay
# Cycle between the layouts in circle_layout.
bind=SUPER,Tab,switch_layout
bind=SUPER+SHIFT,Tab,switcher, all_tag_next

# Flip the dwindle split direction.
bind=SUPER,t,dwindle_toggle_current_split

# Move in scroller stack
bind=SUPER+SHIFT+ALT,h,scroller_stack,left
bind=SUPER+SHIFT+ALT,l,scroller_stack,right
bind=SUPER+SHIFT+ALT,j,scroller_stack,down
bind=SUPER+SHIFT+ALT,k,scroller_stack,up


# -- Scratchpad --
# Show or hide the scratchpad, send a window to it, bring minimized windows back.
bind=SUPER,space,toggle_special_tag
bind=SUPER+SHIFT,space,tag_special_tag
bind=SUPER,d,toggle_scratchpad
bind=SUPER+SHIFT,d,minimized
bind=SUPER,m,restore_minimized


bind=SUPER+ALT,h,groupjoin,left
bind=SUPER+ALT,j,groupjoin,down
bind=SUPER+ALT,k,groupjoin,up
bind=SUPER+ALT,l,groupjoin,right
bind=SUPER+SHIFT,g,groupfocus,next
bind=SUPER+ALT,m,groupleave
# -- Gaps --
bind=SUPER,Plus,incgaps,1
bind=SUPER,Minus,incgaps,-1

# -- Tags (workspaces) --
# SUPER+N shows tag N, SUPER+SHIFT+N moves the focused window to tag N.
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

# Quick access to the first three tags.
# bind=SUPER,u,view,1,0
# bind=SUPER,i,view,2,0
# bind=SUPER,o,view,3,0

# Previous / next tag that has windows.
bind=SUPER,p,viewtoleft_have_client,0
bind=SUPER,n,viewtoright_have_client,0

# Add or remove a tag on the focused window.
bind=CTRL+SUPER,1,toggletag,1
bind=CTRL+SUPER,2,toggletag,2
bind=CTRL+SUPER,3,toggletag,3
bind=CTRL+SUPER,4,toggletag,4
bind=CTRL+SUPER,5,toggletag,5
bind=CTRL+SUPER,6,toggletag,6
bind=CTRL+SUPER,7,toggletag,7
bind=CTRL+SUPER,8,toggletag,8
bind=CTRL+SUPER,9,toggletag,9

# -- Volume, brightness and media (amane) --
bind=SUPER,Up,spawn,amane ipc call volume up
bind=SUPER,Down,spawn,amane ipc call volume down
bind=SUPER,Right,spawn,amane ipc call brightness up
bind=SUPER,Left,spawn,amane ipc call brightness down

bind=none,XF86AudioRaiseVolume,spawn,amane ipc call volume up
bind=none,XF86AudioLowerVolume,spawn,amane ipc call volume down
bind=none,XF86AudioMute,spawn,amane ipc call volume mute
bind=none,XF86AudioPlay,spawn,amane ipc call media play-pause
bind=none,XF86AudioNext,spawn,amane ipc call media next
bind=none,XF86AudioPrev,spawn,amane ipc call media previous
bind=none,XF86MonBrightnessUp,spawn,amane ipc call brightness up
bind=none,XF86MonBrightnessDown,spawn,amane ipc call brightness down

bind=SUPER+SHIFT,c,spawn,amane ipc call picker

# ==========================================================================
# MOUSE AND SCROLL BINDINGS
# ==========================================================================
# SUPER+left drag moves a window, SUPER+SHIFT+left drag resizes it.
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
# ALT+middle click sets the scroller width to half the screen.
mousebind=alt,btn_middle,set_proportion,0.5
# SUPER+scroll switches to the previous / next tag with windows.
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ==========================================================================
# WINDOW RULES
# ==========================================================================
# Preview windows from ueberzugpp float.
window_rule=is_floating:1,app_id:^ueberzugpp_.*

# ==========================================================================
# LAYER RULES
# ==========================================================================
# No shadow on the amane shell surfaces.
# layer_rule=no_shadow:1,layer_name:amane
