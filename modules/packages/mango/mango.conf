# ==========================================================================
# MONITOR
# monitor_rule=name:<regex>,width:<px>,height:<px>,refresh:<Hz>,x:<px>,y:<px>,scale:<factor>
#   name      regex against the output name. Use ^...$ for an exact match
#             (^DP-1$). ".*" matches every output, fine for one monitor.
#   make, model, serial   alternative matchers. If several matchers are set,
#                         all of them must match.
#   x, y      top-left position in the layout. Never use negative values with
#             XWayland apps, clicks break. Start at 0,0.
#   scale     HiDPI scale factor (1 = native).
#   vrr       0 or 1, variable refresh rate.
#   rr        transform: 0 none, 1/2/3 rotate 90/180/270 counter-clockwise,
#             4-7 are the flipped variants.
#   primary   1 makes this the X11 (RandR) primary output for XWayland.
#   disable   1 disables the monitor.
# Rules are matched in order and only the first matching rule applies.
# Run `wlr-randr` to see your output name and supported modes. Replace ".*"
# with the real name (for example ^DP-1$) once you know it, and confirm that
# 1920x1080@180 is listed, otherwise mango cannot use that refresh rate.
# ==========================================================================
monitor_rule=name:.*,width:1920,height:1080,refresh:180,x:0,y:0,scale:1

# ==========================================================================
# EFFECTS
# Blur, shadows, corners and transparency (all rendered with scenefx).
# ==========================================================================

# Blur is GPU heavy. blur=0 disables window blur, so blur_params_* have no
# effect until you set blur=1.
#   blur            blur behind translucent windows.
#   blur_layer      blur layer surfaces too (bars, docks).
#   blur_optimized  cache the wallpaper blur. Keep this at 1, turning it off
#                   costs a lot of GPU.
#   blur_params_*   passes (smoothness vs cost), radius (strength), noise,
#                   brightness, contrast, saturation.
blur=0
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# Shadows.
#   shadows / layer_shadows  enable for windows / layer surfaces.
#   shadow_only_floating     only floating windows get a shadow (cheaper).
#   shadows_size, shadows_blur   size and softness.
#   shadows_position_x/y     offset in px.
#   shadows_color            0xRRGGBBAA.
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff

# Corners and opacity (0.0 to 1.0).
#   no_radius_when_single=0  keep rounded corners on a lone window.
border_radius=5
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.85

# ==========================================================================
# ANIMATIONS
# animations / layer_animations   master switches (windows / layer surfaces).
# animation_type_*   slide, zoom, fade or none.
# animation_fade_in/out, fade_in/out_begin_opacity   fade on open/close and
#                    the opacity it starts from.
# tag_animation_direction   1 horizontal, 0 vertical.
# zoom_initial_ratio, zoom_end_ratio   size range for zoom animations.
# animation_duration_*   milliseconds (move, open, tag, close, focus).
# animation_curve_*      cubic bezier x1,y1,x2,y2. y may exceed 1 to overshoot.
# ==========================================================================
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.7
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=400
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.58,0.98,0.58,0.98
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0
# 1 (Two-finger), 2 (Edge), 4 (Button).
mouse_scroll_method=4
axis_scroll_factor=1.0

# ==========================================================================
# SCROLLER LAYOUT
# A scrollable strip of windows, similar to PaperWM.
#   scroller_structs                    width kept free on the sides when the window ratio is 1.
#   scroller_default_proportion         default width of new windows (fraction of the screen).
#   scroller_focus_center               1 always centres the focused window.
#   scroller_prefer_center              1 centres the focused window only if it was outside the view.
#   edge_scroller_pointer_focus         focus windows even if partly off-screen.
#   scroller_ignore_proportion_single   1 ignores width changes for a lone window.
#   scroller_default_proportion_single  width of a lone window. Only applies when
#                                       scroller_ignore_proportion_single=0.
#   scroller_proportion_preset          widths cycled by switch_proportion_preset.
# NOTE: scroller_prefer_overspread (default 1) outranks scroller_focus_center,
# which outranks scroller_prefer_center. With the default, scroller_prefer_center=1
# below has no effect. To make it apply, uncomment the next line.
# scroller_prefer_overspread=0
# ==========================================================================
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# ==========================================================================
# MASTER-STACK LAYOUT (tile, center_tile)
#   new_is_master          a new window becomes the master.
#   smart_gaps             1 removes gaps when only one window is present.
#   default_master_factor  split ratio between master and stack areas.
#   default_master_count   number of master windows.
# ==========================================================================
new_is_master=0
smart_gaps=0
default_master_factor=0.55
default_master_count=1

# ==========================================================================
# DWINDLE LAYOUT
# A binary tree of splits: each new window splits the focused one.
#   dwindle_smart_split          1 picks the split axis from the cursor position.
#   dwindle_drop_simple_split    1 uses a 2-zone drop preview, 0 uses 4 quadrants.
#   dwindle_manual_split         1 enables manual split mode.
#   dwindle_horizontal_split     side-by-side splits: 0 follow cursor, 1 right, 2 left.
#   dwindle_vertical_split       top/bottom splits: 0 follow cursor, 1 below, 2 above.
#   dwindle_preserve_split       keep the sibling's split orientation when a window closes.
# ==========================================================================
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# ==========================================================================
# OVERVIEW
# The zoomed-out view of all windows.
#   enable_hotarea       1 opens overview when the cursor enters the hot corner.
#   hotarea_size         size of the hot corner in px.
#   hotarea_corner       0 top-left, 1 top-right, 2 bottom-left (default), 3 bottom-right.
#   overview_gap_inner / overview_gap_outer   gaps between and around windows, in px.
# In overview, left-click jumps to a window and right-click closes it.
# ==========================================================================
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# ==========================================================================
# MISC
#   xwayland_persistence      keep XWayland running with no X11 apps open.
#   sync_obj_enable           drm_syncobj timeline support (needs a restart).
#   axis_bind_apply_timeout   ms window for consecutive scroll events in axisbind.
#   focus_on_activate         focus windows that ask for activation.
#   sloppy_focus              focus follows the cursor.
#   warp_cursor               cursor jumps to the window focused via keyboard.
#   focus_cross_monitor       directional focus may cross monitors.
#   focus_cross_tag           directional focus may cross into other tags.
#   circle_layout             layouts that switch_layout cycles through.
#   enable_floating_snap      floating windows snap to edges and each other.
#   snap_distance             px distance that triggers snapping.
#   cursor_size, cursor_theme cursor appearance. The theme must be installed.
#   cursor_hide_timeout       seconds before the cursor hides, 0 never.
#   drag_tile_to_tile         drag a tiled window onto another to swap them.
#   single_scratchpad         only one scratchpad (named or standard) visible at a time.
#   no_border_when_single     1 removes the border of a lone window.
# ==========================================================================
xwayland_persistence=0
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=tile,scroller
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad=1

# ==========================================================================
# KEYBOARD
#   repeat_rate        repeats per second for a held key.
#   repeat_delay       ms before a held key starts repeating.
#   numlock_on         1 turns NumLock on at startup.
#   xkb_rules_layout   layout code, e.g. us or us,de.
#   xkb_rules_options  XKB options. Both lines below are examples, uncomment one:
#                        ctrl:nocaps               Caps Lock acts as Ctrl
#                        grp:alt_altgr_toggle,caps:hyper   layout toggle and Hyper
# ==========================================================================
repeat_rate=70
repeat_delay=300
numlock_on=1
xkb_rules_layout=us
# xkb_rules_options=ctrl:nocaps
# xkb_rules_options=grp:alt_altgr_toggle,caps:hyper

# ==========================================================================
# TRACKPAD
# disable_trackpad=1 turns the trackpad off entirely.
# ==========================================================================
disable_trackpad=1

# ==========================================================================
# APPEARANCE
# Dimensions in px. Colours are 0xRRGGBBAA.
#   border_px                         border width.
#   gap_inner_horizontal / vertical   gaps between windows.
#   gap_outer_horizontal / vertical   gaps between windows and the screen edge.
#   scratchpad_width_ratio / height_ratio   scratchpad size as a screen fraction.
#   root_color              background behind windows.
#   border_color            unfocused window border.
#   focus_color             focused window border.
#   drop_color              preview shown while dragging a window.
#   split_color             split border in the manual dwindle layout.
#   maximized_screen_color, urgent_color, scratchpad_color, global_color,
#   overlay_color           border colour for windows in those states.
# ==========================================================================
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=15
gap_outer_vertical=15
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x444444ff
focus_color=0x8BAA9Bff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0xBABD2Cff
urgent_color=0xad401fff
scratchpad_color=0xc4939dff
global_color=0x8d64cfff
overlay_color=0x95C381ff

# theme-manager: generated colours, loaded AFTER the values above so they
# override them. The hard-coded colours above are the fallback: if
# theme-manager is not installed, has not run yet, or its file is missing,
# this line is ignored and mango keeps them. Borders, radius and gaps always
# come from this file, theme-manager only sets colours.
source_optional=~/.config/mango/theme.conf

bind=SUPER+SHIFT,b,spawn,firefox
# bind=CTRL+ALT,a,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t ppm - | satty -f -

# ==========================================================================
# KEY BINDINGS
# bind=<MODIFIERS>,<KEY>,<COMMAND>,<PARAMETERS>
#   Modifiers: SUPER, CTRL, ALT, SHIFT, NONE. Combine with + (SUPER+SHIFT).
#   Keys are xev/wev key names, or code:N for a raw keycode.
#   Flags after "bind": l works on the lock screen, r triggers on release,
#   s matches the keysym, p passes the key to the client, c allows conflicts.
# ==========================================================================

# -- Compositor --
# SUPER+r reloads the config, SUPER+x quits mango.
bind=SUPER,r,reload_config
bind=SUPER,x,quit

# -- Launch and close --
bind=SUPER,Return,spawn,kitty
bind=SUPER,q,killclient

# -- Focus --
# Tab opens overview and cycles focus to the next window while it is open.
# u jumps back to the last focused window. h/j/k/l focus left/down/up/right.
bind=SUPER,Tab,overcircle,next
# bind=ALT,Tab,togglejump
# bind=SUPER+shift,n,focusstack,next
bind=SUPER,u,focuslast
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# -- Swap windows --
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# -- Move floating windows by 50px --
bindc=CTRL+SHIFT,k,movewin,+0,-50
bindc=CTRL+SHIFT,j,movewin,+0,+50
bindc=CTRL+SHIFT,h,movewin,-50,+0
bindc=CTRL+SHIFT,l,movewin,+50,+0

# -- Resize windows by 50px --
bindc=CTRL+SUPER,k,resizewin,+0,-10
bindc=CTRL+SUPER,j,resizewin,+0,+10
bindc=CTRL+SUPER,h,resizewin,-10,+0
bindc=CTRL+SUPER,l,resizewin,+10,+0

# -- Window state --
# s toggles floating, f toggles fullscreen, SUPER+SHIFT+f toggles fake
# fullscreen (window stays constrained), SUPER+SHIFT+b opens firefox.
# Commented: toggleglobal pins a window to all tags, togglemaximizescreen
# maximizes but keeps the bar, minimized sends a window to the scratchpad,
# restore_minimized brings it back, toggleoverlay toggles overlay state,
# toggle_scratchpad shows or hides the scratchpad.
bind=SUPER+SHIFT,s,toggleglobal,
bind=SUPER,s,togglefloating,
# bind=ALT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,


bind=SUPER+SHIFT,d,minimized,
bind=SUPER+SHIFT,m,restore_minimized
# bind=SUPER,o,toggleoverlay,
bind=SUPER,d,toggle_scratchpad

# -- Scroller layout (commented) --
# set_proportion sets the window width, switch_proportion_preset cycles
# scroller_proportion_preset, scroller_stack moves a window into or out of a stack.
# bind=ALT,e,set_proportion,1.0
# bind=ALT,x,switch_proportion_preset,
# bind=alt+super+ctrl,Left,scroller_stack,left
# bind=alt+super+ctrl,Right,scroller_stack,right
# bind=alt+super+ctrl,Up,scroller_stack,up
# bind=alt+super+ctrl,Down,scroller_stack,down

# -- Dwindle layout (commented) --
# bind=alt+shift,Return,dwindle_toggle_split_direction

# -- Tile layout (commented) --
# incnmaster changes the master window count, zoom swaps the focused window
# with the master.
# bind=SUPER,e,incnmaster,1
# bind=SUPER,t,incnmaster,-1
# bind=ALT,s,zoom,

# -- Switch layout (commented) --
# setlayout picks a layout directly, switch_layout cycles circle_layout.
# bind=SUPER,Minus,setlayout,tile
# bind=SUPER,Plus,setlayout,scroller
bind=SUPER,Escape,switch_layout

# -- Tag switching with arrow keys (commented) --
# viewtoleft/right change tag, the _have_client variants skip empty tags,
# tagtoleft/right move the focused window to the adjacent tag.
# bind=SUPER,p,viewtoleft,0
bind=SUPER,p,viewtoleft_have_client,0
# bind=SUPER,n,viewtoright,0
bind=SUPER,n,viewtoright_have_client,0
# bind=CTRL+SUPER,Left,tagtoleft,0
# bind=CTRL+SUPER,Right,tagtoright,0

# -- Tags (workspaces) --
# SUPER+N shows tag N, SUPER+SHIFT+N moves the focused window to tag N.
# SUPER+0 views tag 10, which only exists if you raise tag_num (default 9).
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# -- Toggle tags (commented) --
# toggletag adds or removes a tag on the focused window.
# toggleview adds or removes a tag from the current view.
bind=ctrl+Super,1,toggletag,1
bind=ctrl+Super,2,toggletag,2
bind=ctrl+Super,3,toggletag,3
bind=ctrl+Super,4,toggletag,4
bind=ctrl+Super,5,toggletag,5
bind=ctrl+Super,6,toggletag,6
bind=ctrl+Super,7,toggletag,7
bind=ctrl+Super,8,toggletag,8
bind=ctrl+Super,9,toggletag,9
#
# bind=Super,1,toggleview,1
# bind=Super,2,toggleview,2
# bind=Super,3,toggleview,3
# bind=Super,4,toggleview,4
# bind=Super,5,toggleview,5
# bind=Super,6,toggleview,6
# bind=Super,7,toggleview,7
# bind=Super,8,toggleview,8
# bind=Super,9,toggleview,9

# -- Gaps (commented) --
# incgaps grows or shrinks gaps, togglegaps turns them off and on.
bind=SUPER,Plus,incgaps,1
bind=SUPER,Minus,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# ==========================================================================
# MOUSE BINDINGS
# mousebind=<MODIFIERS>,<BUTTON>,<COMMAND>,<PARAMETERS>
# With NONE as modifier only btn_middle works in normal mode, btn_left and
# btn_right with NONE only work in overview.
#   SUPER+left drag     move a window
#   SUPER+right drag    resize a window
#   SUPER+CTRL+left     minimize
#   SUPER+CTRL+middle   toggle fullscreen
#   ALT+middle          set scroller proportion to 0.5
#   middle click        toggle maximize
# ==========================================================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
# mousebind=SUPER+CTRL,btn_left,minimized
# mousebind=SUPER+CTRL,btn_middle,togglefullscreen
# mousebind=NONE,btn_middle,togglemaximizescreen,0

# ==========================================================================
# AXIS (SCROLL WHEEL) BINDINGS (commented)
# axisbind=<MODIFIERS>,<UP|DOWN|LEFT|RIGHT>,<COMMAND>,<PARAMETERS>
# ==========================================================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# axisbind=alt,UP,focusdir,left
# axisbind=alt,DOWN,focusdir,right
# axisbind=shift+super,UP,exchange_client,left
# axisbind=shift+super,DOWN,exchange_client,right

# ==========================================================================
# TOUCHPAD GESTURES (commented)
# gesturebind=<MODIFIERS>,<up|down|left|right>,<3|4 fingers>,<COMMAND>,<PARAMETERS>
# 3 fingers move focus, 4 fingers change tag and open or close overview.
# ==========================================================================
# gesturebind=none,left,3,focusdir,left
# gesturebind=none,right,3,focusdir,right
# gesturebind=none,up,3,focusdir,up
# gesturebind=none,down,3,focusdir,down
# gesturebind=none,right,4,viewprev_have_client
# gesturebind=none,left,4,viewnext_have_client
# gesturebind=none,up,4,enteroverview
# gesturebind=none,down,4,leaveoverview

# ==========================================================================
# MEDIA KEYS AND CUSTOM APP BINDS (commented)
# The volume and brightness examples call scripts you must create yourself.
# spawn_shell runs through a shell, so pipes and $(...) work.
# CTRL+ALT+a: region screenshot with grim and slurp, annotated in satty.
# NOTE: SUPER+h and SUPER+l below clash with the focus binds above, enable
# only one of them.
# ==========================================================================
# bind=none,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh up
# bind=none,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume.sh down
# bind=none,XF86AudioMute,spawn,~/.config/mango/scripts/volume.sh mute
# bind=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
# bind=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down
#
# ==========================================================================
# WINDOW RULES (all commented out)
# window_rule=<key>:<value>,<key>:<value>,...
#   Applied every time a window opens. window_rule_once applies only the
#   first time.
#   app_id and title are regex (use ^...$ for exact). If both are given,
#   both must match.
#   Common keys: is_floating, is_fullscreen, is_overlay, is_open_silent,
#   is_tag_silent, is_term, no_swallow, is_unmanaged_global, is_named_scratchpad,
#   force_fake_maximize, no_size_hint, no_border, no_shadow, no_radius, no_blur,
#   no_fade_in, no_fade_out, focused_opacity, unfocused_opacity,
#   animation_type_open/close, width, height (below 1 means a fraction of the
#   screen), offset_x/offset_y (percent from centre, -999 to 999),
#   tags (1-9, or 1|3|5), monitor, global_key_binding.
# The examples were written for the original author's apps. Copy the ones you
# need and match app_id and title to your own windows.
# ==========================================================================

