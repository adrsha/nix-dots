# ==========================================================================
# LAYER RULES (all commented out)
# layer_rule=layer_name:<regex>,<key>:<value>,...
# Targets layer-shell surfaces: bars, launchers, notification daemons.
# Keys: no_blur, no_animation, no_shadow (0 or 1), animation_type_open/close
# (slide, zoom, fade, none), shield_when_capture.
# Find a layer's name with `mmsg get last_open_surface`.
# ==========================================================================

